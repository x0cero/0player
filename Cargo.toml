[package]
name = "zeroplayer"
version = "0.1.0"
edition = "2024"
description = "A zero-player game: a local LLM plays Game Boy games and streams its reasoning."
license = "MIT"

[[bin]]
name = "0player"
path = "src/main.rs"

[dependencies]
gameboy = { git = "https://github.com/x0cero/gameboy" }
gba = { git = "https://github.com/x0cero/gba" }
ureq = { version = "2", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"
tiny_http = "0.12"

[patch."https://github.com/x0cero/gameboy"]
gameboy = { path = "../gameboy" }

[patch."https://github.com/x0cero/gba"]
gba = { path = "../gba" }
