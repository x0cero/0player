<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>0player</title>
<style>
  :root {
    --bg: #101113;
    --panel: #17181b;
    --line: #26282c;
    --text: #d6d3cc;
    --dim: #7d7a73;
    --accent: #8ab4a0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 ui-monospace, "SF Mono", Menlo, monospace;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    align-items: baseline;
    gap: 12px;
    padding: 14px 20px;
    border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: 0.04em; }
  header .sub { color: var(--dim); font-size: 12px; }
  header button {
    margin-left: auto;
    background: none;
    border: 1px solid var(--line);
    color: var(--text);
    font: inherit;
    font-size: 12px;
    padding: 4px 14px;
    border-radius: 4px;
    cursor: pointer;
  }
  header button:hover { border-color: var(--accent); }
  main { flex: 1; display: flex; min-height: 0; }
  .screen {
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 24px;
    border-right: 1px solid var(--line);
  }
  .screen img {
    width: 480px;
    max-width: 60vw;
    image-rendering: pixelated;
    border: 1px solid var(--line);
    background: #000;
  }
  #action {
    min-height: 22px;
    color: var(--accent);
    font-size: 13px;
    letter-spacing: 0.06em;
  }
  .log {
    flex: 1;
    overflow-y: auto;
    padding: 20px 24px;
    min-width: 0;
  }
  .turn { margin-bottom: 18px; }
  .turn .meta { color: var(--dim); font-size: 11px; margin-bottom: 4px; letter-spacing: 0.08em; }
  .turn .body { white-space: pre-wrap; word-break: break-word; }
  .turn .body .action-line { color: var(--accent); }
  .err { color: #c98a7d; }
</style>
</head>
<body>
<header>
  <h1>0player</h1>
  <span class="sub">a zero-player game</span>
  <button id="pause">pause</button>
</header>
<main>
  <div class="screen">
    <img id="frame" src="/frame.png" alt="game screen">
    <div id="action"></div>
  </div>
  <div class="log" id="log"></div>
</main>
<script>
  const log = document.getElementById('log');
  const frame = document.getElementById('frame');
  const action = document.getElementById('action');
  let current = null;

  frame.addEventListener('error', () => {
    setTimeout(() => { frame.src = '/frame.png?t=' + Date.now(); }, 1000);
  });
  // Belt and braces: refresh the frame on a timer too, so a missed or failed
  // load can never leave the screen stale.
  setInterval(() => { frame.src = '/frame.png?t=' + Date.now(); }, 2000);

  const es = new EventSource('/events');
  es.addEventListener('frame', () => {
    frame.src = '/frame.png?t=' + Date.now();
  });
  es.addEventListener('turn', (e) => {
    current = document.createElement('div');
    current.className = 'turn';
    current.innerHTML = '<div class="meta">TURN ' + e.data + '</div><div class="body"></div>';
    log.appendChild(current);
    log.scrollTop = log.scrollHeight;
  });
  es.addEventListener('token', (e) => {
    if (!current) return;
    current.querySelector('.body').textContent += JSON.parse(e.data);
    log.scrollTop = log.scrollHeight;
  });
  es.addEventListener('action', (e) => {
    action.textContent = 'ACTION  ' + JSON.parse(e.data);
  });
  es.addEventListener('error-msg', () => {});
  es.addEventListener('error', (e) => {
    if (e.data === undefined) return; // connection-level errors have no data
    const d = document.createElement('div');
    d.className = 'turn err';
    d.textContent = JSON.parse(e.data);
    log.appendChild(d);
  });
  document.getElementById('pause').addEventListener('click', async (e) => {
    const r = await fetch('/pause');
    e.target.textContent = (await r.text()) === 'paused' ? 'resume' : 'pause';
  });
</script>
</body>
</html>
